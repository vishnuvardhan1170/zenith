name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  
jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint Python
        run: ruff check .

  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  lint-k8s:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install yamllint
      run: |
        python3 -m pip install --user yamllint==1.38.0

    - name: Install kubeconform
      uses: bmuschko/setup-kubeconform@v1
      with:
        kubeconform-version: "0.8.0"

    - name: Validate Kubernetes YAML syntax
      run: yamllint k8s

    - name: Validate Kubernetes manifests
      run: kubeconform -strict -summary k8s/*.yaml


  test:
    runs-on: ubuntu-latest
    needs: [lint-python, lint-dockerfile, lint-k8s]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Basic app import test
        run: python -c "import app; print('import ok')"

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t zenith-app:ci .

